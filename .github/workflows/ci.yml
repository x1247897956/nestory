name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic test dates; this does not configure a user's deployment.
  TZ: Asia/Shanghai

jobs:
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install locked npm and frontend dependencies
        run: |
          npm_version=$(node -p "require('./web/package.json').engines.npm")
          npm install --global "npm@$npm_version"
          npm ci --prefix web --no-audit --no-fund

      - name: Check frontend types
        run: npm run typecheck --prefix web

      - name: Test frontend
        run: npm run test --prefix web -- --run

      - name: Build embedded frontend
        run: npm run build --prefix web

      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l cmd internal migrations web/embed.go)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet Go
        run: go vet ./...

      - name: Test Go with race detection
        run: go test -race -shuffle=on -count=1 -cover ./...

      - name: Test migration tooling
        run: node --test scripts/tests/prepare-block-migration.test.mjs

  runtime:
    name: Image and Chromium checks
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NOTEAPP_TEST_IMAGE: noteapp:ci
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked npm and frontend dependencies
        run: |
          npm_version=$(node -p "require('./web/package.json').engines.npm")
          npm install --global "npm@$npm_version"
          npm ci --prefix web --no-audit --no-fund

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image with commit version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: noteapp:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image and host tooling
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Install Chromium
        timeout-minutes: 5
        run: npm exec --prefix web -- playwright install --with-deps chromium

      - name: Run isolated Chromium regression
        run: sh scripts/audit/run_browser.sh "$NOTEAPP_TEST_IMAGE"

      - name: Preserve failed browser results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-failure-${{ github.run_attempt }}
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
