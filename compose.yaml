services:
  noteapp:
    build: .
    image: noteapp:local
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      APP_DATA_DIR: /data
      APP_UPLOAD_LIMIT: ${APP_UPLOAD_LIMIT:-20971520}
    volumes:
      - noteapp-data:/data
volumes:
  noteapp-data:
